        .card { background: #18191a; padding: 15px; border-radius: 12px; display: inline-block; width: 100%; max-width: 450px; box-shadow: 0 8px 20px rgba(255, 71, 87, 0.2); box-sizing: border-box; text-align: left; border: 1px solid #2f3542; }
        h2 { text-align: center; color: #ff4757; margin-bottom: 8px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .progress-container { width: 100%; background-color: #2f3542; border-radius: 5px; margin-bottom: 12px; overflow: hidden; height: 8px; }
        .progress-bar { width: 0%; height: 100%; background-color: #ff4757; transition: width 0.3s ease; }

        .stage { color: #ff6b81; font-weight: bold; font-size: 12px; text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .dialogue { font-size: 18px; margin: 10px 0 15px 0; font-style: italic; line-height: 1.5; color: #fff; min-height: 75px; background: #212224; padding: 12px; border-radius: 8px; border-left: 4px solid #ff4757; }
        .timer { color: #f1c40f; font-size: 13px; margin-bottom: 12px; text-align: center; font-weight: bold; }

        .btn-group { display: flex; gap: 8px; margin-bottom: 8px; }
        button { background-color: #ff4757; color: white; border: none; padding: 11px; font-size: 14px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #ff6b81; }
        button:disabled { background-color: #3d3d3d; color: #777; cursor: not-allowed; }
        .btn-secondary { background-color: #2f3542; }
        .btn-secondary:hover { background-color: #57606f; }
        .btn-warning { background-color: #e67e22; }

        .section-box { margin-top: 15px; border-top: 1px solid #2f3542; padding-top: 10px; }
        .section-box h4 { margin: 0 0 6px 0; font-size: 13px; color: #a4b0be; }
        input[type="text"] { width: calc(100% - 16px); padding: 9px; border-radius: 6px; border: 1px solid #444; background: #2f3542; color: #fff; font-size: 13px; margin-bottom: 6px; }
        
        .notification-box { background: #2f3542; border-left: 4px solid #2ed573; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; border-radius: 4px; display: none; }
        
        .reaction-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 8px; }
        .reaction-btn { background: #3742fa; font-size: 12px; padding: 8px; }
        
        .audio-controls { display: flex; justify-content: space-between; align-items: center; background: #2f3542; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔥 Phone Sex Vulgar 🔥</h2>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="stage">
            <span id="stage-text">Siap Tempur</span>
            <span id="mode-indicator" style="color: #ff4757;">Mode: Vulgar Hot</span>
        </div>
        
        <div id="notif-box" class="notification-box">
            💬 <b>Respons Pacar:</b> <span id="notif-text">Menunggu...</span>
        </div>

        <p class="dialogue" id="dialogue-text">"Tekan mulai, siapin suara beratmu, dan buat dia lemas di ujung telepon."</p>
        <p class="timer" id="timer-text"></p>

        <div class="btn-group">
            <button id="next-btn" onclick="nextStep()">Lanjut Manual</button>
            <button id="auto-btn" class="btn-secondary" onclick="toggleAutoPlay()">Mulai Otomatis</button>
        </div>

        <div class="section-box">

                <button class="reaction-btn" onclick="triggerDare()">🎲 Tantangan Nakal</button>
            </div>
        </div>

        <div class="section-box">
            <h4>Ketik Kata-Kata Spontan</h4>
            <input type="text" id="custom-dialogue" placeholder="Ketik kata nakal buatanmu sendiri...">
            <button class="btn-secondary" onclick="addCustomScript()" style="width: 100%; padding: 7px; font-size: 13px;">Masukkan ke Antrean</button>
        </div>

        <div class="section-box">
            <h4>Suasana Latar Belakang</h4>
            <div class="audio-controls">
                <span>Suasana Malam (Rileks)</span>
                <button class="btn-secondary" onclick="toggleAudio()" id="audio-btn" style="flex: none; padding: 5px 10px; font-size: 12px;">Putar Musik</button>
            </div>
            <audio id="ambient-audio" loop>
                <source src="https://cdn.pixabay.com/download/audio/2021/09/06/audio_753a817478.mp3?filename=rain-and-thunder-nature-sounds-7591.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

    <script>
        // Skrip dirombak total jadi jauh lebih vulgar, mentah, dan to the point ala obrolan panas
        let steps = [
            { stage: "1. Pemanasan Awal", dialogue: "Buka celana dalam kamu sekarang, sayang... bayangin aku ada di depan kamu sambil mandangin bodi telanjangmu." },
            { stage: "2. Sentuhan Kasar", dialogue: "Tangan aku langsung ngeramasin teleran dada kamu yang kenyal... ngenyot puting kamu kenceng-kenceng sampe kamu mendesah." },
            { stage: "3. Area Sensitif", dialogue: "Jari aku mulai colok masuk ke memek kamu yang udah becek... basah banget rasanya, minta dimainin." },
            { stage: "4. Pamer Batang", dialogue: "Punya aku udah keras parah, uratnya nribul semua gara-gara ngebayangin sempitnya lubang memek kamu." },
            { stage: "5. Mulai Ngentot Imajiner", dialogue: "Aku tancep batang aku ke memek kamu... *ahh*, sempit dan anget banget anjing, enak banget dijepit!" },
            { stage: "6. Hantaman Brutal", dialogue: "Aku genjot memek kamu makin kenceng! *Crot-crot... ahh...* dengerin suara hantaman aku!" },
            { stage: "7. Klimaks / Semprot", dialogue: "Aku gak tahan lagi! Aku tumpahin semua sperma kental aku di dalam rahim kamu... *ahh, crot!*" },
            { stage: "8. Penutup", dialogue: "Fyuuh... lemas. Lap paha kamu yang basah ya sayang, bobok yang nyenyak." }
        ];

        let currentIndex = -1;
        let isWaiting = false;
        let isAutoPlaying = false;

        let dares = [
            "Tantangan: Coba sebutin ukuran atau bayangan bentuk punya aku di kepala kamu sekarang!",
            "Tantangan: Kirim chat: 'Aku pengen ditancep sekarang juga!' ke HP kamu.",
            "Tantangan: Pegang dada kamu sendiri terus bayangin itu tangan aku.",
            "Tantangan: Desah pelan di mic sekarang tanpa ngomong apa-apa selama 5 detik."
        ];

        function triggerVibration(pattern) {
            if ("vibrate" in navigator) { navigator.vibrate(pattern); }
        }

        function updateProgress() {
            let progress = ((currentIndex + 1) / steps.length) * 100;
            document.getElementById("progress-bar").style.width = progress + "%";
        }

        function nextStep() {
            if (isWaiting) return;
            
            currentIndex++;
            if (currentIndex < steps.length) {
                let current = steps[currentIndex];
                document.getElementById("stage-text").innerText = current.stage + ` (${currentIndex + 1}/${steps.length})`;
                document.getElementById("dialogue-text").innerText = `"${current.dialogue}"`;
                updateProgress();
                
                if (currentIndex >= steps.length - 2) {
                    triggerVibration([300, 100, 400, 100, 600]);
                } else {
                    triggerVibration(200);
                }
                
                startTimer(5);
            } else {
                endSession();
            }
        }

        function startTimer(seconds) {
            isWaiting = true;
            let btn = document.getElementById("next-btn");
            btn.disabled = true;
            
            let timerInterval = setInterval(() => {
                document.getElementById("timer-text").innerText = `Tunggu balasan emoji/reaksi: ${seconds} detik...`;
                seconds--;
                
                if (seconds < 0) {
                    clearInterval(timerInterval);
                    document.getElementById("timer-text").innerText = "Jeda selesai. Lanjut!";
                    btn.disabled = false;
                    isWaiting = false;

                    if (isAutoPlaying && currentIndex < steps.length - 1) {
                        nextStep();
                    } else if (isAutoPlaying && currentIndex >= steps.length - 1) {
                        endSession();
                    }
                }
            }, 1000);
        }

        function toggleAutoPlay() {
            let autoBtn = document.getElementById("auto-btn");
            if (!isAutoPlaying) {
                isAutoPlaying = true;
                autoBtn.innerText = "Berhentikan Otomatis";
                autoBtn.style.backgroundColor = "#eb4d4b";
                if (currentIndex === -1 || currentIndex >= steps.length - 1) {
                    currentIndex = -1;
                    nextStep();
                } else if (!isWaiting) {
                    nextStep();
                }
            } else {
                isAutoPlaying = false;
                autoBtn.innerText = "Mulai Otomatis";
                autoBtn.style.backgroundColor = "#2f3542";
            }
        }

        function sendReaction(text) {
            let box = document.getElementById("notif-box");
            let textSpan = document.getElementById("notif-text");
            textSpan.innerText = text;
            box.style.display = "block";
            triggerVibration([100, 50, 100]);
            
            setTimeout(() => { box.style.display = "none"; }, 4000);
        }

        function triggerDare() {
            let randomDare = dares[Math.floor(Math.random() * dares.length)];
            sendReaction(randomDare);
        }

        function addCustomScript() {
            let customInput = document.getElementById("custom-dialogue");
            let text = customInput.value.trim();
            if (text !== "") {
                steps.push({ stage: "Spontan Nakal", dialogue: text });
                customInput.value = "";
                alert("Kalimat vulgar kustom masuk antrean!");
            }
        }

        function toggleAudio() {
            let audio = document.getElementById("ambient-audio");
            let audioBtn = document.getElementById("audio-btn");
            if (audio.paused) {
                audio.play();
                audioBtn.innerText = "Matikan Musik";
                audioBtn.style.backgroundColor = "#eb4d4b";
            } else {
                audio.pause();
                audioBtn.innerText = "Putar Musik";
                audioBtn.style.backgroundColor = "#2f3542";
            }
        }

        function endSession() {
            document.getElementById("stage-text").innerText = "Selesai";
            document.getElementById("dialogue-text").innerText = "Sesi phone sex selesai. Jangan lupa istirahat!";
            document.getElementById("timer-text").innerText = "";
            document.getElementById("next-btn").style.display = "none";
            document.getElementById("auto-btn").style.display = "none";
            document.getElementById("progress-bar").style.width = "100%";
            isAutoPlaying = false;
        }
    </script>
</body>
</html>
