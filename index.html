<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Dirty Talk Interactive</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0c10; color: #fff; text-align: center; padding: 10px; margin: 0; }
        .card { background: #1f2833; padding: 15px; border-radius: 12px; display: inline-block; width: 100%; max-width: 450px; box-shadow: 0 0 25px rgba(255, 0, 76, 0.4); box-sizing: border-box; text-align: left; border: 2px solid #ff004c; }
        h2 { text-align: center; color: #ff004c; margin-bottom: 8px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }

        /* Kotak Media (Foto & Video Berganti Tiap 3 Percakapan) */
        .media-container { width: 100%; height: 210px; background-color: #000; border-radius: 8px; margin-bottom: 10px; overflow: hidden; border: 2px solid #ff004c; display: flex; align-items: center; justify-content: center; position: relative; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: contain; }

        /* Indikator Sesi & Progress */
        .info-bar { display: flex; justify-content: space-between; font-size: 11px; color: #c5c6c7; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        
        /* Area Percakapan Chat Style */
        .chat-box { height: 250px; background: #0b0c10; border-radius: 8px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; border: 1px solid #45a29e; margin-bottom: 10px; scroll-behavior: smooth; }
        
        .bubble { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .bubble.me { background: #ff004c; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bubble.partner { background: #c5c6c7; color: #0b0c10; align-self: flex-start; border-bottom-left-radius: 2px; font-weight: 500; }
        .bubble-sender { font-size: 10px; font-weight: bold; margin-bottom: 2px; opacity: 0.8; }

        /* Tombol Aksi */
        .btn-action { background: linear-gradient(45deg, #ff004c, #ff4757); color: white; border: none; padding: 12px; font-size: 14px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255,0,76,0.4); }
        .btn-action:hover { opacity: 0.9; }

        .audio-section { margin-top: 10px; border-top: 1px solid #45a29e; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .btn-sm { background-color: #45a29e; color: #0b0c10; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔥 Live Dirty Talk Chat 🔥</h2>
        
        <!-- Media Berganti Otomatis Tiap 3 Percakapan -->
        <div class="media-container" id="media-box">
            <video id="media-video" autoplay loop muted playsinline style="display:none;"></video>
            <img id="media-img" src="static/1.jpg" alt="Media Sesi" onerror="this.src='https://via.placeholder.com/450x210/000/ff004c?text=Upload+1.jpg+s/d+7.jpg+di+folder+static'">
        </div>

        <div class="info-bar">
            <span id="progress-text">Percakapan: 1 / 21</span>
            <span id="media-label" style="color: #ff004c;">Media Aktif: 1 (Foto)</span>
        </div>

        <!-- Kotak Chat Percakapan -->
        <div class="chat-box" id="chat-container">
            <!-- Pesan awal akan masuk via JS -->
        </div>

        <!-- Tombol Lanjut Percakapan -->
        <button class="btn-action" id="next-btn" onclick="nextChat()">Balas Chat Selanjutnya ➔</button>

        <div class="audio-section">
            <span id="audio-status">Audio Atmosfer: Mati</span>
            <button class="btn-sm" onclick="toggleSynthAudio()">Nyalakan Musik</button>
        </div>
    </div>

    <script>
        // Database 21 Percakapan Saling Balas (Foreplay sampai Klimaks)
        const conversationFlow = [
            // Sesi 1 (Media 1: Foto 1 & Video 1) -> Percakapan 1-3
            { sender: "me", text: "Sayang, mandangin foto kamu nih. Baju merah itu bikin aku sange berat malam ini." },
            { sender: "partner", text: "Hmm gombal terus.. Emang bagian mana yang bikin kamu paling pengen pegang?" },
            { sender: "me", text: "Leher sama dada kamu.. Keliatan banget minta disosor sama diciumin kasar." },

            // Sesi 2 (Media 2: Foto 2 & Video 2) -> Percakapan 4-6
            { sender: "partner", text: "Nakalnya mulai keluar ya.. Kalau aku udah di sebelah kamu, mau kamu apain?" },
            { sender: "me", text: "Aku rebahin kamu di kasur, buka baju kamu pelan-pelan pake gigi aku." },
            { sender: "partner", text: "Ahhh bayanginnya aja udah bikin kulit aku merinding.. Lanjut lagi sayang." },

            // Sesi 3 (Media 3: Foto 3 & Video 3) -> Percakapan 7-9
            { sender: "me", text: "Tangan aku mulai turun ngelus perut kamu, ngerasain kulit kamu yang halus." },
            { sender: "partner", text: "Duh.. jangan disentuh di situ, geli tapi rasanya bikin lemas.." },
            { sender: "me", text: "Biarin lemas, karena jari aku bakal langsung masuk ke celana dalam kamu sekarang." },

            // Sesi 4 (Media 4: Foto 4 & Video 4) -> Percakapan 10-12
            { sender: "partner", text: "Ahh shh.. Jangan dibilang-bilang gitu, malu tau denger suara serak kamu.." },
            { sender: "me", text: "Ga usah malu, rasain nih.. jari aku udah colok masuk ke memek kamu yang basah." },
            { sender: "partner", text: "Ughh.. iya sayang, becek banget rasanya.. licin gara-gara air sange aku.." },

            // Sesi 5 (Media 5: Foto 5 & Video 5) -> Percakapan 13-15
            { sender: "me", text: "Punya aku udah keras parah, uratnya tegang ngebayangin sempitnya lubang kamu." },
            { sender: "partner", text: "Tusuk aku sekarang sayang! Jangan ditahan lagi, cepetan masukin!" },
            { sender: "me", text: "Jleb! Batang aku masuk telak ke dalam rahim kamu.. anget dan sempit banget anjir!" },

            // Sesi 6 (Media 6: Foto 6 & Video 6) -> Percakapan 16-18
            { sender: "partner", text: "Ahhh sakit tapi nikmat! Plak-plak! Genjot terus aku sampe mau pingsan!" },
            { sender: "me", text: "Aku hantam makin kenceng! Denger suara desahan kamu bikin aku gak terkontrol!" },
            { sender: "partner", text: "Udah mau keluar aku sayang! Bersamaan yaaa... Ahhh!" },

            // Sesi 7 (Media 7: Video 7) -> Percakapan 19-21 (Klimaks & Penutup)
            { sender: "me", text: "Crot! Aku tumpahin semua sperma kental aku di dalam rahim kamu sampai luber!" },
            { sender: "partner", text: "Ahhhhh crot dalem banget! Rasanya panas di dalam.. lemas semuanya.." },
            { sender: "me", text: "Good girl. Sesi selesai, peluk guling erat-erat ya sayang, bobok nyenyak." }
        ];

        let currentIndex = 0;

        function triggerVibration(pattern) {
            if ("vibrate" in navigator) { navigator.vibrate(pattern); }
        }

        function updateMediaDisplay(index) {
            // Menentukan nomor media (1 sampai 7) berdasarkan setiap 3 percakapan
            // Indeks 0-2 = Media 1, 3-5 = Media 2, dst.
            let mediaGroup = Math.floor(index / 3) + 1;
            if (mediaGroup > 7) mediaGroup = 7; // Batasi maksimal sampai 7

            let imgElem = document.getElementById("media-img");
            let vidElem = document.getElementById("media-video");
            let labelElem = document.getElementById("media-label");

            // Aturan pergantian: Selang-seling atau tampilkan video/foto sesuai file lokal
            // Disini kita buat sistem: Ganjil pakai foto (.jpg), Genap pakai video (.mp4) atau sebaliknya. 
            // Sesuai request: "upload di static foto dan video yang saya kasih nama 1-7"
            if (mediaGroup % 2 === 0) {
                // Tampilkan Video (.mp4)
                imgElem.style.display = "none";
                vidElem.style.display = "block";
                vidElem.src = `static/${mediaGroup}.mp4`;
                vidElem.play();
                labelElem.innerText = `Media Aktif: ${mediaGroup}.mp4 (Video)`;
            } else {
                // Tampilkan Foto (.jpg)
                vidElem.style.display = "none";
                imgElem.style.display = "block";
                imgElem.src = `static/${mediaGroup}.jpg`;
                labelElem.innerText = `Media Aktif: ${mediaGroup}.jpg (Foto)`;
            }
        }

        function nextChat() {
            if (currentIndex < conversationFlow.length) {
                let chatContainer = document.getElementById("chat-container");
                let data = conversationFlow[currentIndex];

                // Buat elemen bubble chat
                let bubble = document.createElement("div");
                bubble.className = `bubble ${data.sender}`;
                
                let senderName = document.createElement("div");
                senderName.className = "bubble-sender";
                senderName.innerText = data.sender === "me" ? "Kamu (Hendra)" : "Pacar (Nisa)";
                
                let textNode = document.createElement("div");
                textNode.innerText = data.text;

                bubble.appendChild(senderName);
                bubble.appendChild(textNode);
                chatContainer.appendChild(bubble);

                // Auto scroll ke bawah chat terbaru
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // Perbarui media (tiap 3 percakapan berganti)
                updateMediaDisplay(currentIndex);

                // Update teks progress
                document.getElementById("progress-text").innerText = `Percakapan: ${currentIndex + 1} / ${conversationFlow.length}`;

                // Efek getar HP
                if (currentIndex >= 15) {
                    triggerVibration([400, 100, 500, 100, 700]); // Getar kuat pas klimaks
                } else {
                    triggerVibration(150);
                }

                currentIndex++;

                if (currentIndex >= conversationFlow.length) {
                    document.getElementById("next-btn.style.display") = "none";
                    document.getElementById("next-btn").innerText = "Sesi Percakapan Selesai 🔥";
                    document.getElementById("next-btn").disabled = true;
                }
            }
        }

        // Jalankan percakapan pertama otomatis saat halaman dibuka
        window.onload = function() {
            nextChat();
        };

        // Audio Sintetis Latar Belakang
        let audioCtx = null, synthInterval = null, isMusicPlaying = false;
        function toggleSynthAudio() {
            let btn = document.querySelector(".audio-section .btn-sm");
            let status = document.getElementById("audio-status");
            if (!isMusicPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                synthInterval = setInterval(() => {
                    if (!isMusicPlaying || !audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(45, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 2.5);
                }, 2500);
                isMusicPlaying = true;
                btn.innerText = "Matikan";
                status.innerText = "Audio Atmosfer: Menyala";
            } else {
                isMusicPlaying = false;
                clearInterval(synthInterval);
                if (audioCtx) { audioCtx.close(); audioCtx = null; }
                btn.innerText = "Nyalakan";
                status.innerText = "Audio Atmosfer: Mati";
            }
        }
    </script>
</body>
</html>
