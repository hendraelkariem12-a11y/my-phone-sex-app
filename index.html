        .bubble-sender { font-size: 10px; font-weight: bold; margin-bottom: 2px; opacity: 0.8; }

        .btn-action { background: linear-gradient(45deg, #ff004c, #ff4757); color: white; border: none; padding: 12px; font-size: 14px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px 15px rgba(255,0,76,0.4); }
        .btn-action:hover { opacity: 0.9; }

        .audio-section { margin-top: 10px; border-top: 1px solid #222; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .btn-sm { background-color: #2f3542; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; border: 1px solid #ff004c; }
    </style>
</head>

        let currentIndex = 0;

        function triggerVibration(pattern) {
            if ("vibrate" in navigator) { navigator.vibrate(pattern); }
        }

        function updateMediaDisplay(index) {
            // Dibagi rata ke 7 media berdasarkan total 30 percakapan
            let mediaGroup = Math.floor(index / 4.3) + 1;
            if (mediaGroup > 7) mediaGroup = 7;

            let imgElem = document.getElementById("media-img");
            let vidElem = document.getElementById("media-video");
            let labelElem = document.getElementById("media-label");

            if (mediaGroup % 2 === 0) {
                imgElem.style.display = "none";
                vidElem.style.display = "block";
                <video autoplay loop muted playsinline src="static/1.mp4"></video>
                vidElem.src = `static/${mediaGroup}.mp4`;
                vidElem.play();
                labelElem.innerText = `Media Aktif: ${mediaGroup}.mp4 (Video)`;
            } else {
                vidElem.style.display = "none";
                imgElem.style.display = "block";
                imgElem.src = `static/${mediaGroup}.jpg`;
                labelElem.innerText = `Media Aktif: ${mediaGroup}.jpg (Foto)`;
            }
        }

        function nextChat() {
            if (currentIndex < conversationFlow.length) {
                let chatContainer = document.getElementById("chat-container");
                let data = conversationFlow[currentIndex];

                let bubble = document.createElement("div");
                bubble.className = `bubble ${data.sender}`;
                
                let senderName = document.createElement("div");
                senderName.className = "bubble-sender";
                senderName.innerText = data.sender === "me" ? "Kamu (Hendra)" : "Pacar (Nisa)";
                
                let textNode = document.createElement("div");
                textNode.innerText = data.text;

                bubble.appendChild(senderName);
                bubble.appendChild(textNode);
                chatContainer.appendChild(bubble);

                chatContainer.scrollTop = chatContainer.scrollHeight;

                updateMediaDisplay(currentIndex);

                document.getElementById("progress-text").innerText = `Percakapan: ${currentIndex + 1} / ${conversationFlow.length}`;

                if (currentIndex >= 20) {
                    triggerVibration([500, 100, 600, 100, 900]);
                } else {
                    triggerVibration(150);
                }

                currentIndex++;

                if (currentIndex >= conversationFlow.length) {
                    document.getElementById("next-btn").innerText = "Sesi Obrolan Selesai 🔥";
                    document.getElementById("next-btn").disabled = true;
                }
            }
        }

        window.onload = function() {
            nextChat();
        };

        let audioCtx = null, synthInterval = null, isMusicPlaying = false;
        function toggleSynthAudio() {
            let btn = document.querySelector(".audio-section .btn-sm");
            let status = document.getElementById("audio-status");
            if (!isMusicPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                synthInterval = setInterval(() => {
                    if (!isMusicPlaying || !audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(45, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 2.5);
                }, 2500);
                isMusicPlaying = true;
                btn.innerText = "Matikan";
                status.innerText = "Atmosfer: Menyala";
            } else {
                isMusicPlaying = false;
                clearInterval(synthInterval);
                if (audioCtx) { audioCtx.close(); audioCtx = null; }
                btn.innerText = "Nyalakan";
                status.innerText = "Atmosfer: Mati";
            }
        }
