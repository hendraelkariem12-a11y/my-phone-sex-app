<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Sex Extreme Edition with Photo Gallery</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #050505; color: #f5f6fa; text-align: center; padding: 15px; margin: 0; transition: background 0.5s; }
        .card { background: #141517; padding: 15px; border-radius: 12px; display: inline-block; width: 100%; max-width: 450px; box-shadow: 0 8px 25px rgba(255, 71, 87, 0.4); box-sizing: border-box; text-align: left; border: 1px solid #ff4757; }
        h2 { text-align: center; color: #ff4757; margin-bottom: 8px; font-size: 21px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,71,87,0.5); }
        
        /* Kotak Foto Pacar (Diperbaiki agar tampil utuh tidak terpotong) */
        .photo-container { width: 100%; height: 240px; background-color: #000; border-radius: 8px; margin-bottom: 12px; overflow: hidden; border: 2px solid #ff4757; display: flex; align-items: center; justify-content: center; position: relative; }
        .photo-container img { width: 100%; height: 100%; object-fit: contain; }

        .progress-container { width: 100%; background-color: #2f3542; border-radius: 5px; margin-bottom: 12px; overflow: hidden; height: 8px; }
        .progress-bar { width: 0%; height: 100%; background-color: #ff4757; transition: width 0.3s ease; }

        .stage { color: #ff6b81; font-weight: bold; font-size: 12px; text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .dialogue { font-size: 18px; margin: 10px 0 15px 0; font-style: italic; line-height: 1.5; color: #fff; min-height: 75px; background: #1f2023; padding: 12px; border-radius: 8px; border-left: 4px solid #ff4757; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .timer { color: #f1c40f; font-size: 13px; margin-bottom: 12px; text-align: center; font-weight: bold; }

        .btn-group { display: flex; gap: 8px; margin-bottom: 8px; }
        button { background-color: #ff4757; color: white; border: none; padding: 11px; font-size: 14px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #ff6b81; }
        button:disabled { background-color: #3d3d3d; color: #777; cursor: not-allowed; }
        .btn-secondary { background-color: #2f3542; }
        .btn-secondary:hover { background-color: #57606f; }
        .btn-warning { background-color: #e67e22; }

        .section-box { margin-top: 15px; border-top: 1px solid #2f3542; padding-top: 10px; }
        .section-box h4 { margin: 0 0 6px 0; font-size: 13px; color: #a4b0be; }
        input[type="text"] { width: calc(100% - 16px); padding: 9px; border-radius: 6px; border: 1px solid #444; background: #2f3542; color: #fff; font-size: 13px; margin-bottom: 6px; }
        
        .notification-box { background: #2f3542; border-left: 4px solid #2ed573; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; border-radius: 4px; display: none; }
        
        .reaction-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 8px; }
        .reaction-btn { background: #3742fa; font-size: 12px; padding: 8px; }
        
        .audio-controls { display: flex; justify-content: space-between; align-items: center; background: #2f3542; padding: 6px 10px; border-radius: 6px; font-size: 13px; }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 10px rgba(255,71,87,0.4); }
            50% { box-shadow: 0 0 30px rgba(255,71,87,0.9); border-color: #fff; }
            100% { box-shadow: 0 0 10px rgba(255,71,87,0.4); }
        }
        .card-hot { animation: pulse-red 1.5s infinite; }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h2>🔥 Phone Sex Extreme 🔥</h2>
        
        <!-- Area Tampil Foto Pacar Berubah Otomatis -->
        <div class="photo-container">
            <img id="partner-photo" src="static/1.jpg" alt="Foto Pacar" onerror="this.src='https://via.placeholder.com/450x240/000/ff4757?text=Pastikan+1.jpg+di+folder+static'">
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="stage">
            <span id="stage-text">Siap Tempur</span>
            <span id="mode-indicator" style="color: #ff4757;">Mode: Extreme Hot</span>
        </div>
        
        <div id="notif-box" class="notification-box">
            💬 <b>Respons Pacar:</b> <span id="notif-text">Menunggu...</span>
        </div>

        <p class="dialogue" id="dialogue-text">"Nyalakan audio sintetis, tekan mulai, dan hancurkan imajinasinya malam ini!"</p>
        <p class="timer" id="timer-text"></p>

        <div class="btn-group" id="control-buttons">
            <button id="next-btn" onclick="nextStep()">Lanjut Manual</button>
            <button id="auto-btn" class="btn-secondary" onclick="toggleAutoPlay()">Mulai Otomatis</button>
        </div>

        <div class="btn-group" id="restart-group" style="display: none; margin-bottom: 8px;">
            <button class="btn-warning" onclick="restartSession()" style="width: 100%;">🔄 Ulangi Sesi dari Awal</button>
        </div>

        <div class="section-box">
            <h4>Pancingan Respons Cepat</h4>
            <div class="reaction-grid">
                <button class="reaction-btn" onclick="sendReaction('🥵 Ahh cepetan, udah sange banget!')">🥵 Minta Cepat</button>
                <button class="reaction-btn" onclick="sendReaction('💦 Becek parah denger suara kamu!')">💦 Becek Parah</button>
                <button class="reaction-btn" onclick="sendReaction('🛑 Pelan-pelan ah, jangan buru-buru...')">🛑 Tahan Dulu</button>
                <button class="reaction-btn" onclick="triggerDare()">🎲 Tantangan Nakal</button>
            </div>
        </div>

        <div class="section-box">
            <h4>Ketik Kata-Kata Spontan</h4>
            <input type="text" id="custom-dialogue" placeholder="Ketik kata nakal buatanmu sendiri...">
            <button class="btn-secondary" onclick="addCustomScript()" style="width: 100%; padding: 7px; font-size: 13px;">Masukkan ke Antrean</button>
        </div>

        <div class="section-box">
            <h4>Suasana Musik Latar (Sintetis Anti-Gagal)</h4>
            <div class="audio-controls">
                <span id="audio-status">Status: Musik Mati</span>
                <button class="btn-secondary" onclick="toggleSynthAudio()" id="audio-btn" style="flex: none; padding: 6px 12px; font-size: 12px;">Nyalakan Musik</button>
            </div>
        </div>
    </div>

    <script>
        let steps = [
            { stage: "1. Pemanasan Awal", dialogue: "Buka celana dalam kamu sekarang, sayang... bayangin aku ada di depan kamu sambil mandangin bodi telanjangmu yang basah.", photo: "static/1.jpg" },
            { stage: "2. Sentuhan Kasar", dialogue: "Tangan aku langsung ngeramasin dada kamu yang kenyal... ngenyot puting kamu kenceng-kenceng sampe kamu mendesah keenakan.", photo: "static/2.jpg" },
            { stage: "3. Area Sensitif", dialogue: "Jari aku mulai colok masuk ke memek kamu yang udah berair... licin banget rasanya, minta dikelonin sama batang aku.", photo: "static/3.jpg" },
            { stage: "4. Pamer Batang", dialogue: "Punya aku udah keras parah, urat-uratnya nribul semua gara-gara ngebayangin sempitnya lubang memek kamu yang lagi nungguin.", photo: "static/4.jpg" },
            { stage: "5. Mulai Ngentot Imajiner", dialogue: "Aku tancep batang aku ke memek kamu... *ahh*, sempit dan anget banget anjing, enak banget dijepit rahim kamu!", photo: "static/5.jpg" },
            { stage: "6. Hantaman Brutal", dialogue: "Aku genjot memek kamu makin kenceng tanpa ampun! *Crot-crot... ahh...* dengerin suara hantaman aku di telinga kamu!", photo: "static/6.jpg" },
            { stage: "7. Klimaks / Semprot", dialogue: "Aku gak tahan lagi! Aku tumpahin semua sperma kental dan panas aku di dalam rahim kamu... *ahh, crot dalem banget!*", photo: "static/7.jpg" },
            { stage: "8. Penutup", dialogue: "Fyuuh... lemas banget. Lap paha kamu yang basah ya sayang, peluk guling dan bobok yang nyenyak.", photo: "static/8.jpg" }
        ];

        let currentIndex = -1;
        let isWaiting = false;
        let isAutoPlaying = false;

        let dares = [
            "Tantangan: Coba sebutin warna celana dalam yang lagi kamu pake sekarang!",
            "Tantangan: Kirim chat: 'Aku pengen ditancep sekarang juga!' ke HP kamu.",
            "Tantangan: Pegang dada kamu sendiri terus bayangin itu tangan aku.",
            "Tantangan: Desah pelan di mic sekarang tanpa ngomong apa-apa selama 5 detik."
        ];

        let audioCtx = null;
        let synthInterval = null;
        let isMusicPlaying = false;

        function toggleSynthAudio() {
            let btn = document.getElementById("audio-btn");
            let status = document.getElementById("audio-status");

            if (!isMusicPlaying) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }

                synthInterval = setInterval(() => {
                    if (!isMusicPlaying || !audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(55, audioCtx.currentTime); 
                    
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 3);
                }, 3000);

                isMusicPlaying = true;
                btn.innerText = "Matikan Musik";
                btn.style.backgroundColor = "#eb4d4b";
                status.innerText = "Status: Musik Menyala (Sintetis)";
            } else {
                isMusicPlaying = false;
                clearInterval(synthInterval);
                if (audioCtx) { audioCtx.close(); audioCtx = null; }
                btn.innerText = "Nyalakan Musik";
                btn.style.backgroundColor = "#2f3542";
                status.innerText = "Status: Musik Mati";
            }
        }

        function triggerVibration(pattern) {
            if ("vibrate" in navigator) { navigator.vibrate(pattern); }
        }

        function updateProgress() {
            let progress = ((currentIndex + 1) / steps.length) * 100;
            document.getElementById("progress-bar").style.width = progress + "%";
        }

        function nextStep() {
            if (isWaiting) return;
            
            currentIndex++;
            if (currentIndex < steps.length) {
                let current = steps[currentIndex];
                document.getElementById("stage-text").innerText = current.stage + ` (${currentIndex + 1}/${steps.length})`;
                document.getElementById("dialogue-text").innerText = `"${current.dialogue}"`;
                
                // Ubah foto pacar secara otomatis sesuai tahap
                document.getElementById("partner-photo").src = current.photo;

                updateProgress();
                
                let card = document.getElementById("main-card");
                if (currentIndex >= 5) {
                    card.classList.add("card-hot");
                    triggerVibration([400, 100, 400, 100, 800]);
                } else {
                    card.classList.remove("card-hot");
                    triggerVibration(200);
                }
                
                startTimer(8); 
            } else {
                endSession();
            }
        }

        function startTimer(seconds) {
            isWaiting = true;
            let btn = document.getElementById("next-btn");
            btn.disabled = true;
            
            let timerInterval = setInterval(() => {
                document.getElementById("timer-text").innerText = `Tunggu balasan emoji/reaksi: ${seconds} detik...`;
                seconds--;
                
                if (seconds < 0) {
                    clearInterval(timerInterval);
                    document.getElementById("timer-text").innerText = "Jeda selesai. Lanjut!";
                    btn.disabled = false;
                    isWaiting = false;

                    if (isAutoPlaying && currentIndex < steps.length - 1) {
                        nextStep();
                    } else if (isAutoPlaying && currentIndex >= steps.length - 1) {
                        endSession();
                    }
                }
            }, 1000);
        }

        function toggleAutoPlay() {
            let autoBtn = document.getElementById("auto-btn");
            if (!isAutoPlaying) {
                isAutoPlaying = true;
                autoBtn.innerText = "Berhentikan Otomatis";
                autoBtn.style.backgroundColor = "#eb4d4b";
                if (currentIndex === -1 || currentIndex >= steps.length - 1) {
                    currentIndex = -1;
                    nextStep();
                } else if (!isWaiting) {
                    nextStep();
                }
            } else {
                isAutoPlaying = false;
                autoBtn.innerText = "Mulai Otomatis";
                autoBtn.style.backgroundColor = "#2f3542";
            }
        }

        function restartSession() {
            currentIndex = -1;
            isAutoPlaying = false;
            document.getElementById("control-buttons").style.display = "flex";
            document.getElementById("auto-btn").innerText = "Mulai Otomatis";
            document.getElementById("auto-btn").style.backgroundColor = "#2f3542";
            document.getElementById("restart-group").style.display = "none";
            document.getElementById("stage-text").innerText = "Mulai Ulang";
            document.getElementById("dialogue-text").innerText = "\"Sesi diulang dari awal. Siap-siap bikin dia lemas lagi...\"";
            document.getElementById("partner-photo").src = "static/1.jpg";
            document.getElementById("progress-bar").style.width = "0%";
            document.getElementById("timer-text").innerText = "";
            document.getElementById("main-card").classList.remove("card-hot");
        }

        function sendReaction(text) {
            let box = document.getElementById("notif-box");
            let textSpan = document.getElementById("notif-text");
            textSpan.innerText = text;
            box.style.display = "block";
            triggerVibration([100, 50, 100]);
            
            setTimeout(() => { box.style.display = "none"; }, 4000);
        }

        function triggerDare() {
            let randomDare = dares[Math.floor(Math.random() * dares.length)];
            sendReaction(randomDare);
        }

        function addCustomScript() {
            let customInput = document.getElementById("custom-dialogue");
            let text = customInput.value.trim();
            if (text !== "") {
                steps.push({ stage: "Spontan Nakal", dialogue: text, photo: "static/8.jpg" });
                customInput.value = "";
                alert("Kalimat vulgar kustom masuk antrean!");
            }
        }

        function endSession() {
            document.getElementById("stage-text").innerText = "Selesai";
            document.getElementById("dialogue-text").innerText = "Sesi phone sex selesai. Jangan lupa istirahat dan bersihkan diri!";
            document.getElementById("timer-text").innerText = "";
            document.getElementById("control-buttons").style.display = "none";
            document.getElementById("restart-group").style.display = "block";
            document.getElementById("progress-bar").style.width = "100%";
            document.getElementById("main-card").classList.remove("card-hot");
            isAutoPlaying = false;
        }
    </script>
</body>
</html>
