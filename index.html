        .btn-group { display: flex; gap: 8px; margin-bottom: 8px; }

        input[type="text"] { width: calc(100% - 16px); padding: 8px; border-radius: 6px; border: 1px solid #444; background: #2f3542; color: #fff; font-size: 13px; margin-bottom: 6px; }
        
        /* Notifikasi Interaktif Real-Time */

        /* Grid Tombol Reaksi */

        .reaction-btn { background: #3742fa; font-size: 12px; padding: 8px; }
        
        .audio-controls { display: flex; justify-content: space-between; align-items: center; background: #2f3542; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
    </style>
</head>

                { stage: "Pemanasan Halus", dialogue: "Bayangin aku meluk kamu dari belakang, nyium leher kamu dengan lembut..." },

                { stage: "2. Visualisasi Sentuhan", dialogue: "Bayangin aku udah ada di atas kasur kamu, nindih badan kamu pelan-pelan sambil natap mata kamu tajam..." },
                { stage: "3. Rangsangan Kulit", dialogue: "Tangan aku mulai buka kancing baju kamu satu-satu... ngelus kulit perut kamu yang merinding." },
                { stage: "4. Sentuhan Sensitif", dialogue: "Bibir aku turun nyium leher kamu, ngulum kulit sensitif kamu sampe kamu mendesah..." },
                { stage: "5. Peningkatan Suhu", dialogue: "Tangan aku meraba paha mulus kamu, masuk ke celana dalam kamu... rasanya udah basah banget di situ, kan?" },
                { stage: "6. Dirty Talk Intens", dialogue: "Punya aku udah keras banget, tegang parah ngebayangin sempitnya memek kamu. Aku pengen genjot kamu!" },
                { stage: "7. Klimaks", dialogue: "Ahh... shh... aku udah mau keluar sayang! Bayangin aku semprotin sperma panas aku di dalam kamu... ahh!" },
                { stage: "8. Aftercare", dialogue: "Fyuuh... lemas banget. Peluk guling kamu erat-erat ya sayang. Tidur nyenyak..." }
            ],
            "Hardcore": [
                { stage: "1. Provokasi Liar", dialogue: "Buka celana kamu sekarang... biarin aku bayangin bodi telanjang kamu yang lagi nungguin aku!" },
                { stage: "2. Sentuhan Kasar", dialogue: "Aku cengkeram pinggang kamu kenceng-kenceng... gak usah malu-malu dengerin suara nakal aku!" },
                { stage: "3. Eskalasi Cepat", dialogue: "Batang aku udah berdenyut-denyut pengen ngentot memek kamu yang becek sekarang juga!" },
                { stage: "4. Hantaman Brutal", dialogue: "Aku hantam memek kamu kenceng-kenceng tanpa ampun! *Ahh... ahh*... rasain nikmatnya!" },
                { stage: "5. Klimaks Brutal", dialogue: "Crot! Aku tumpahin semua cairan panas aku di rahim kamu sampai banjir! Selesai." }
            ]
        };

        let currentMode = "Hot";
        let steps = scriptLibrary[currentMode];
        let currentIndex = -1;
        let isWaiting = false;
        let isAutoPlaying = false;

        let dares = [
            "Tantangan: Sebutin warna celana dalam yang lagi kamu pake sekarang!",
            "Tantangan: Deskripsikan bagian tubuh aku yang paling bikin kamu horor.",
            "Tantangan: Kirim 5 emoji desahan berturut-turut ke chat sekarang!",
            "Tantangan: Bisikin ke mic HP apa posisi favorit kamu kalau kita ketemu."
        ];

        function triggerVibration(pattern) {
            // Fitur Getar Haptic HP (jika didukung browser HP)
            if ("vibrate" in navigator) {
                navigator.vibrate(pattern);
            }
        }

        function changeMode(mode) {
            currentMode = mode;
            steps = scriptLibrary[mode];
            currentIndex = -1;
            document.getElementById("mode-indicator").innerText = "Mode: " + mode;
            alert("Mode berhasil diubah ke: " + mode);
            nextStep();
        }

        function updateProgress() {
            let progress = ((currentIndex + 1) / steps.length) * 100;
            document.getElementById("progress-bar").style.width = progress + "%";
        }

        function nextStep() {
            if (isWaiting) return;
            
            currentIndex++;
            if (currentIndex < steps.length) {
                let current = steps[currentIndex];
                document.getElementById("stage-text").innerText = current.stage + ` (${currentIndex + 1}/${steps.length})`;
                document.getElementById("dialogue-text").innerText = `"${current.dialogue}"`;
                updateProgress();
                
                // Pemicu Getar Otomatis berdasarkan progress tahap
                if (currentIndex >= steps.length - 2) {
                    triggerVibration([300, 100, 300, 100, 500]); // Getar intens di tahap klimaks
                } else {
                    triggerVibration(150); // Getar pelan di tahap biasa
                }
                
                startTimer(5);
            } else {
                endSession();
            }
        }

        function startTimer(seconds) {
            isWaiting = true;
            let btn = document.getElementById("next-btn");
            btn.disabled = true;
            
            let timerInterval = setInterval(() => {
                document.getElementById("timer-text").innerText = `Tunggu balasan emoji: ${seconds} detik...`;
                seconds--;
                
                if (seconds < 0) {
                    clearInterval(timerInterval);
                    document.getElementById("timer-text").innerText = "Jeda selesai. Silakan lanjut!";
                    btn.disabled = false;
                    isWaiting = false;

                    if (isAutoPlaying && currentIndex < steps.length - 1) {
                        nextStep();
                    } else if (isAutoPlaying && currentIndex >= steps.length - 1) {
                        endSession();
                    }
                }
            }, 1000);
        }

        function toggleAutoPlay() {
            let autoBtn = document.getElementById("auto-btn");
            if (!isAutoPlaying) {
                isAutoPlaying = true;
                autoBtn.innerText = "Berhentikan Otomatis";
                autoBtn.style.backgroundColor = "#eb4d4b";
                if (currentIndex === -1 || currentIndex >= steps.length - 1) {
                    currentIndex = -1;
                    nextStep();
                } else if (!isWaiting) {
                    nextStep();
                }
            } else {
                isAutoPlaying = false;
                autoBtn.innerText = "Mulai Otomatis";
                autoBtn.style.backgroundColor = "#2f3542";
            }
        }

        function sendReaction(text) {
            let box = document.getElementById("notif-box");
            let textSpan = document.getElementById("notif-text");
            textSpan.innerText = text;
            box.style.display = "block";
            triggerVibration([100, 50, 100]);
            
            setTimeout(() => {
                box.style.display = "none";
            }, 4000);
        }

        function triggerDare() {
            let randomDare = dares[Math.floor(Math.random() * dares.length)];
            sendReaction(randomDare);
        }

        function addCustomScript() {
            let customInput = document.getElementById("custom-dialogue");
            let text = customInput.value.trim();
            if (text !== "") {
                steps.push({ stage: "Spontan", dialogue: text });
                customInput.value = "";
                alert("Kalimat kustom masuk antrean!");
            }
        }

        function toggleAudio() {
            let audio = document.getElementById("ambient-audio");
            let audioBtn = document.getElementById("audio-btn");
            if (audio.paused) {
                audio.play();
                audioBtn.innerText = "Matikan Musik";
                audioBtn.style.backgroundColor = "#eb4d4b";
            } else {
                audio.pause();
                audioBtn.innerText = "Putar Musik";
                audioBtn.style.backgroundColor = "#2f3542";
            }
        }

        function endSession() {
            document.getElementById("stage-text").innerText = "Selesai";
            document.getElementById("dialogue-text").innerText = "Sesi phone sex telah berakhir. Selamat istirahat!";
            document.getElementById("timer-text").innerText = "";
            document.getElementById("next-btn").style.display = "none";
            document.getElementById("auto-btn").style.display = "none";
            document.getElementById("progress-bar").style.width = "100%";
            isAutoPlaying = false;
        }
    </script>
</body>
